<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />

  <meta name="theme-color" content="#110e16" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="HEHEARSE — мерч" />
  <meta property="og:description" content="Каталог мерча по любимым фандомам. Наличие обновляется автоматически — выбирай и заказывай в Telegram." />
  <meta property="og:url" content="https://sterhn.github.io/Merch_page/" />
  <meta property="og:image" content="https://sterhn.github.io/Merch_page/assets/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Concrete';
      src: url('assets/fonts/concrete-regular.woff2') format('woff2'),
           url('assets/fonts/concrete-regular.otf') format('opentype');
      font-weight: 400;
      font-display: swap;
    }
    :root {
      color-scheme: dark;
      --bg: #110e16;
      --surface: #1a1520;
      --ink: #ede5da;
      /* Both greys are tuned to clear WCAG AA on --bg: muted ≈ 5.9:1, faint ≈ 4.5:1 */
      --muted: #9b8f81;
      --faint: #857a6e;
      --accent: #5aa0a0;
      --accent-soft: rgba(90,160,160,0.25);
      --page-accent: #5aa0a0;
      --display: 'Concrete', 'Courier New', monospace;
      --sans: 'IBM Plex Sans', system-ui, sans-serif;
      --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    /* Reserve the scrollbar gutter so locking the body when an overlay opens
       doesn't shift the whole page sideways. */
    html { scrollbar-gutter: stable; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body.scroll-locked { overflow: hidden; }
    a { color: var(--accent); transition: color 0.2s; }
    a:hover { color: #7dbdbd; }
    :focus-visible { outline: 2px solid var(--page-accent); outline-offset: 2px; }
    ::selection { background: color-mix(in srgb, var(--page-accent) 35%, transparent); color: var(--ink); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(138,126,114,0.25); border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(138,126,114,0.4); }

    /* Hand-drawn icons: <svg class="ico"><use href="#i-…"/></svg>, drawn from
       the sprite at the top of <body>; each spot below sets its own size */
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .ico { width: 1em; height: 1em; flex-shrink: 0; }

    .wrap { position: relative; z-index: 2; max-width: 860px; margin: 0 auto; padding: 48px 24px 120px; }

    /* Header */
    .header { text-align: center; margin-bottom: 48px; padding-top: 24px; animation: fadeUp .8s ease both; }
    .header h1 {
      font-family: var(--display);
      font-size: clamp(2.2rem, 9vw, 3.6rem);
      font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; margin: 0 0 8px;
      background: linear-gradient(90deg, #c8b8a8, #f0e8de 30%, var(--page-accent) 50%, #f0e8de 70%, #c8b8a8);
      background-size: 200% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: headerShimmer 6s ease-in-out infinite;
    }
    @keyframes headerShimmer { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0% 0; } }
    /* Hand-drawn heartbeat strip (assets/icons/heartbeat.png): it flatlines
       under the name — fitting for a hearse — and traces itself in once,
       like an ECG monitor. */
    .header-pulse { position: relative; width: min(100%, 480px); margin: 0 auto 28px; }
    .pulse-line {
      display: block; width: 100%; height: auto; aspect-ratio: 20 / 1;
      fill: none; stroke: var(--page-accent); stroke-width: 2.9;
      stroke-linecap: round; stroke-linejoin: round; opacity: .75;
      transition: stroke .6s;
      animation: ecgTrace 1.4s linear .3s both;
    }
    @keyframes ecgTrace { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    /* The sparkle sits on the flat stretch (y = 32.25 of the strip's 50);
       its background halo breaks the line either side of it */
    .header-ornament {
      position: absolute; left: 50%; top: 64.5%; transform: translate(-50%, -50%);
      display: flex; padding: 0 10px; background: var(--bg);
      color: var(--page-accent); transition: color .6s;
    }
    .header-ornament .ico {
      width: 22px; height: 22px; opacity: .7;
      animation: sparkIn .6s cubic-bezier(.3,1.6,.5,1) 1s both, ornamentPulse 3s ease-in-out 1.6s infinite;
    }
    @keyframes sparkIn { from { opacity: 0; transform: scale(.2) rotate(-90deg); } to { opacity: .5; transform: none; } }
    @keyframes ornamentPulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }
    .tg-link {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 24px; border: 1px solid rgba(90,160,160,0.3);
      color: var(--accent); text-decoration: none;
      font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .12em;
      transition: all .3s; background: rgba(90,160,160,0.05);
    }
    .tg-link:hover { background: rgba(90,160,160,0.12); border-color: rgba(90,160,160,0.5); color: #7dbdbd; }
    .tg-link svg { width: 14px; height: 14px; fill: currentColor; }

    /* Controls: fandom selection + type chips */
    .controls { margin-bottom: 40px; animation: fadeUp .8s ease both .15s; opacity: 0; }
    .fandoms { display: flex; flex-wrap: wrap; gap: 10px; }
    .fandom-btn {
      flex: 1 1 calc(50% - 5px); min-width: 150px;
      padding: 14px 16px; cursor: pointer;
      background: rgba(31,26,40,0.5); border: 1px solid rgba(138,126,114,0.15);
      font-family: var(--display); font-size: var(--fs, 1.15rem); font-weight: 700;
      letter-spacing: .04em; color: var(--ink); text-align: left;
      display: flex; align-items: baseline; gap: 10px;
      transition: all .25s;
    }
    .fandom-btn .orn {
      width: 22px; height: 22px; align-self: center;
      color: var(--fc, var(--accent)); opacity: .85;
      transition: transform .35s cubic-bezier(.3,1.6,.5,1), opacity .25s, filter .25s;
    }
    .fandom-btn:hover .orn { transform: rotate(-10deg) scale(1.15); opacity: 1; }
    .fandom-btn.active .orn {
      opacity: 1;
      filter: drop-shadow(0 0 6px color-mix(in srgb, var(--fc, var(--accent)) 70%, transparent));
    }
    .fandom-btn .cnt {
      margin-left: auto; align-self: center;
      font-family: var(--mono); font-size: .6rem; font-weight: 400;
      letter-spacing: .08em; color: var(--muted);
    }
    .fandom-btn:hover { border-color: color-mix(in srgb, var(--fc, var(--accent)) 45%, transparent); }
    .fandom-btn.active {
      border-color: color-mix(in srgb, var(--fc, var(--accent)) 60%, transparent);
      background: color-mix(in srgb, var(--fc, var(--accent)) 12%, rgba(31,26,40,0.5));
    }
    .fandoms.has-active .fandom-btn:not(.active) { opacity: .45; }

    /* Small type chips */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .chip {
      padding: 5px 10px; border: 1px solid rgba(138,126,114,0.18); border-radius: 2px;
      background: transparent; color: var(--muted); cursor: pointer;
      font-family: var(--sans); font-size: .66rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .08em;
      transition: all .2s;
    }
    .chip:hover { border-color: var(--accent-soft); color: var(--accent); }
    .chip.active {
      border-color: rgba(90,160,160,0.5); color: var(--accent);
      background: rgba(90,160,160,0.1);
    }
    .chip-stock { margin-left: auto; border-style: dashed; }

    /* Status */
    .status {
      text-align: center; color: var(--muted);
      font-family: var(--display);
      font-style: italic; font-size: 1.05rem;
    }

    /* Skeleton loading */
    .sk-header { height: 22px; width: 180px; margin-bottom: 20px; }
    .sk-card { aspect-ratio: 1 / 1.35; }
    .sk {
      background: linear-gradient(100deg, rgba(31,26,40,0.8) 40%, rgba(50,42,62,0.8) 50%, rgba(31,26,40,0.8) 60%);
      background-size: 200% 100%;
      animation: skShimmer 1.4s ease-in-out infinite;
      border: 1px solid rgba(138,126,114,0.08);
    }
    @keyframes skShimmer { 0% { background-position: 120% 0; } 100% { background-position: -80% 0; } }

    /* Fandom groups */
    .fandom-group { margin-bottom: 48px; }
    .fandom-header {
      display: flex; align-items: baseline; gap: 12px;
      margin-bottom: 20px; padding-bottom: 12px;
    }
    .fandom-header .orn { width: 24px; height: 24px; opacity: .9; align-self: center; }
    .fandom-header h2 {
      font-family: var(--display);
      font-size: 1.5rem; font-weight: 700; color: var(--ink);
      margin: 0; letter-spacing: .04em;
    }
    .fandom-header .line { flex: 1; height: 1px; }
    /* indent = icon (24px) + header gap (12px), so it lines up under the title */
    .fandom-full { margin: -12px 0 18px; padding-left: 36px; line-height: 1.6; }
    .fandom-en {
      font-size: .74rem; color: var(--muted); letter-spacing: .08em;
    }
    .fandom-ru {
      font-size: .68rem; color: var(--faint); letter-spacing: .06em;
    }

    /* Card grid */
    .card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 640px) { .card-grid { grid-template-columns: repeat(3, 1fr); } }
    .card {
      background: rgba(31,26,40,0.6); border: 1px solid rgba(138,126,114,0.1);
      overflow: hidden; transition: transform .3s, box-shadow .3s, border-color .3s; position: relative;
      display: flex; flex-direction: column;
    }
    .card::before, .card::after {
      content: ''; position: absolute; width: 14px; height: 14px; z-index: 3;
      border: 0 solid var(--fc, var(--accent));
      opacity: 0; transition: opacity .3s; pointer-events: none;
    }
    .card::before { top: 6px; left: 6px; border-top-width: 1px; border-left-width: 1px; }
    .card::after { bottom: 6px; right: 6px; border-bottom-width: 1px; border-right-width: 1px; }
    .card:hover::before, .card:hover::after { opacity: .8; }
    .card:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 12px 40px rgba(0,0,0,0.3); border-color: rgba(90,160,160,0.25); }
    .card.sold-out { opacity: 0.5; }
    .card.sold-out .card-img img, .card.sold-out .card-img .ph { filter: grayscale(1); }
    /* A real <button> so the card art is reachable by keyboard and screen readers */
    .card-img {
      width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative; cursor: pointer;
      padding: 0; border: none; background: none; font: inherit; color: inherit;
      flex-shrink: 0;
    }
    .card-img:focus-visible { outline-offset: -3px; }
    .card-img img { width: 100%; height: 100%; object-fit: contain; transition: transform .4s ease, filter .4s; }
    .card:hover .card-img img { transform: scale(1.06); }
    /* No picture yet: the fandom's icon stands in */
    .card-img .ph { width: 38%; height: 38%; opacity: .45; transition: transform .4s ease; }
    .card:hover .card-img .ph { transform: rotate(-6deg) scale(1.1); }
    .card-idx {
      position: absolute; top: 10px; left: 10px;
      font-family: var(--mono); font-size: .6rem; letter-spacing: .1em;
      color: var(--muted); background: rgba(17,14,22,0.6);
      padding: 3px 6px; backdrop-filter: blur(8px);
    }
    .stock-badge {
      position: absolute; bottom: 10px; right: 10px;
      padding: 4px 10px; backdrop-filter: blur(8px);
      color: var(--muted); font-size: .65rem; font-weight: 600;
      letter-spacing: .05em; text-transform: uppercase;
    }
    .stock-badge.in-stock { background: rgba(17,14,22,0.75); }

    /* Sold-out rubber stamp */
    .stamp {
      position: absolute; left: 50%; top: 50%; z-index: 2;
      transform: translate(-50%, -50%) rotate(-12deg);
      border: 2px solid rgba(196,85,85,0.85); border-radius: 3px;
      color: rgba(228,124,124,0.95); background: rgba(17,14,22,0.35);
      padding: 5px 12px; font-size: .68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .18em; white-space: nowrap;
      box-shadow: inset 0 0 6px rgba(196,85,85,0.25);
      text-shadow: 0 0 1px rgba(228,124,124,0.6);
      pointer-events: none;
    }
    .detail-img .stamp {
      font-size: 1.05rem; padding: 9px 22px; border-width: 3px; letter-spacing: .24em;
    }
    .card-info { padding: 10px 12px 12px; flex: 1; display: flex; flex-direction: column; }
    .card-type {
      font-size: .62rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .12em; margin-bottom: 3px;
    }
    .card-name {
      font-family: var(--display);
      font-size: .95rem; font-weight: 600; color: var(--ink);
      margin-bottom: 8px; line-height: 1.3;
    }
    /* margin-top:auto keeps price + add button on one line across a row of
       cards whose names wrap to different heights */
    .card-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 4px; }
    .card-price { font-family: var(--display); font-size: 1rem; font-weight: 700; color: var(--accent); }
    .add-btn {
      min-width: 40px; height: 40px; padding: 0 10px;
      border: 1px solid rgba(138,126,114,0.25); background: transparent;
      color: var(--muted); font-size: .9rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s; font-family: var(--sans);
    }
    .add-btn:hover { border-color: rgba(90,160,160,0.5); color: var(--accent); background: rgba(90,160,160,0.08); }
    .add-btn.in-cart { border-color: rgba(90,160,160,0.5); background: rgba(90,160,160,0.12); color: var(--accent); }

    /* Detail overlay */
    .detail-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(11,9,14,0.85); backdrop-filter: blur(14px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .3s;
      padding: 20px;
    }
    .detail-overlay.open { opacity: 1; pointer-events: auto; }
    .detail-card {
      background: var(--surface); border: 1px solid rgba(90,160,160,0.15);
      max-width: 360px; width: 100%; max-height: 85vh; overflow-y: auto; overscroll-behavior: contain;
      transform: translateY(30px) scale(0.95); transition: transform .35s cubic-bezier(.4,0,.2,1);
      position: relative;
    }
    .detail-overlay.open .detail-card { transform: translateY(0) scale(1); }
    @media (min-width: 640px) { .detail-card { max-width: 420px; } }
    .detail-close {
      position: absolute; top: 12px; right: 12px; z-index: 2;
      width: 36px; height: 36px; border: 1px solid rgba(138,126,114,0.3);
      background: rgba(17,14,22,0.8); backdrop-filter: blur(8px);
      color: var(--muted); font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all .2s;
    }
    .detail-close:hover { background: rgba(138,126,114,0.15); color: var(--ink); }
    .detail-img {
      width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }
    .detail-img img { width: 100%; height: 100%; object-fit: contain; }
    .detail-img.sold img { filter: grayscale(1); opacity: .75; }
    .detail-img .ph { width: 34%; height: 34%; opacity: .35; }
    /* grayscale only: the photo's .75 opacity would make a placeholder brighter, not dimmer */
    .detail-img.sold .ph { filter: grayscale(1); }
    .detail-info { padding: 20px; }
    .detail-type {
      font-size: .6rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .12em; margin-bottom: 4px;
    }
    .detail-fandom {
      font-size: .65rem; color: var(--faint); letter-spacing: .08em;
      margin-bottom: 8px;
    }
    .detail-name {
      font-family: var(--display);
      font-size: 1.4rem; font-weight: 700; color: var(--ink);
      line-height: 1.3; margin-bottom: 10px;
    }
    .detail-desc {
      font-size: .85rem; color: var(--muted); line-height: 1.6;
      margin-bottom: 16px;
    }
    .detail-bottom {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 14px; border-top: 1px solid rgba(138,126,114,0.1);
    }
    .detail-price {
      font-family: var(--display);
      font-size: 1.3rem; font-weight: 700; color: var(--accent);
    }
    .detail-add {
      padding: 10px 20px; min-height: 40px; border: 1px solid rgba(90,160,160,0.4);
      background: rgba(90,160,160,0.08); color: var(--accent);
      font-family: var(--sans);
      font-size: .75rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .08em; cursor: pointer; transition: all .2s;
    }
    .detail-add:hover { background: rgba(90,160,160,0.18); border-color: rgba(90,160,160,0.6); }
    .detail-add.in-cart { background: rgba(90,160,160,0.15); }
    .detail-sold { color: var(--faint); font-size: .75rem; font-style: italic; font-family: var(--display); }

    .cart-badge.pulse { animation: badgePulse .5s ease; }
    @keyframes badgePulse { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }

    /* Animations */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { opacity: 0; animation: fadeUp .5s ease both; }

    /* Footer */
    .footer {
      margin-top: 64px; padding-top: 24px; text-align: center;
    }
    .footer-rule { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 16px; }
    .footer-rule .line { flex: 1; max-width: 120px; height: 1px; }
    .footer-rule .line-l { background: linear-gradient(to right, transparent, rgba(138,126,114,0.3)); }
    .footer-rule .line-r { background: linear-gradient(to left, transparent, rgba(138,126,114,0.3)); }
    .footer-rule .orn { width: 16px; height: 16px; color: var(--faint); }
    .footer span {
      font-family: var(--display);
      font-size: .8rem; color: var(--faint); letter-spacing: .1em;
    }

    /* Cart bar — ticket stub */
    .cart-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: linear-gradient(135deg, #1a2a2a 0%, #1a1f28 100%);
      border-top: 1px dashed rgba(90,160,160,0.35);
      transform: translateY(100%); transition: transform .4s cubic-bezier(.4,0,.2,1);
      backdrop-filter: blur(20px);
    }
    .cart-bar::before {
      content: ''; position: absolute; top: -1px; left: 0; right: 0; height: 8px;
      background: radial-gradient(circle at 7px 0, var(--bg) 4px, transparent 4.5px);
      background-size: 16px 8px; background-repeat: repeat-x;
      pointer-events: none;
    }
    .cart-bar.visible { transform: translateY(0); }
    /* A real <button>: the bar was a click-only <div>, unreachable by keyboard */
    .cart-bar-inner {
      max-width: 860px; margin: 0 auto; width: 100%;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px 14px; cursor: pointer;
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
      background: none; border: none; font: inherit; color: inherit; text-align: left;
    }
    .cart-bar-inner:focus-visible { outline-offset: -3px; }
    .cart-bar-left { display: flex; align-items: center; gap: 12px; }
    .cart-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, #4a8f8f, #5aa0a0);
      color: #fff; font-size: .8rem; font-weight: 700;
    }
    .cart-bar-label {
      font-family: var(--display);
      font-size: .9rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .1em; color: var(--ink);
    }
    .cart-bar-total {
      font-family: var(--display);
      font-size: 1.15rem; font-weight: 700; color: var(--accent);
    }

    /* Cart panel */
    .cart-overlay {
      position: fixed; inset: 0; background: rgba(11,9,14,0.7);
      backdrop-filter: blur(8px); z-index: 200;
      opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    .cart-overlay.open { opacity: 1; pointer-events: auto; }
    .cart-panel {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 201;
      background: var(--surface); border-top: 1px solid rgba(90,160,160,0.2);
      max-height: 80vh; overflow-y: auto; overscroll-behavior: contain;
      transform: translateY(100%); transition: transform .4s cubic-bezier(.4,0,.2,1);
    }
    .cart-panel.open { transform: translateY(0); }
    .cart-panel-inner {
      max-width: 860px; margin: 0 auto;
      padding: 24px 24px calc(32px + env(safe-area-inset-bottom));
    }
    .cart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .cart-title {
      font-family: var(--display);
      font-size: 1.3rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    }
    .cart-close {
      width: 40px; height: 40px; border: 1px solid rgba(138,126,114,0.3);
      background: transparent; color: var(--muted);
      font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all .2s;
    }
    .cart-close:hover { background: rgba(138,126,114,0.1); color: var(--ink); }
    .cart-item {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 0; border-bottom: 1px solid rgba(138,126,114,0.1);
    }
    .cart-item:last-child { border-bottom: none; }
    .cart-item .info { flex: 1; min-width: 0; }
    .cart-item .name {
      font-family: var(--display);
      font-weight: 600; font-size: .95rem; color: var(--ink);
    }
    .cart-item .type-tag { font-size: .65rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--faint); }
    /* Thumbnail so a long order stays scannable at a glance */
    .cart-item .thumb {
      width: 46px; height: 46px; flex-shrink: 0; overflow: hidden;
      border: 1px solid rgba(138,126,114,0.15);
      display: flex; align-items: center; justify-content: center;
    }
    .cart-item .thumb img { width: 100%; height: 100%; object-fit: contain; }
    .cart-item .thumb .ph { width: 24px; height: 24px; opacity: .6; }
    .cart-item .cart-price { font-size: .8rem; font-weight: 700; color: var(--accent); margin-top: 2px; }
    .qty-controls { display: flex; align-items: center; flex-shrink: 0; }
    .qty-btn {
      width: 40px; height: 40px; border: 1px solid rgba(138,126,114,0.25);
      background: transparent; color: var(--muted);
      font-size: 1rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .qty-btn:hover { background: rgba(138,126,114,0.1); color: var(--ink); }
    .qty-val {
      width: 40px; height: 40px;
      border-top: 1px solid rgba(138,126,114,0.25);
      border-bottom: 1px solid rgba(138,126,114,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem; font-weight: 700; color: var(--ink);
    }
    .cart-total-row {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-top: 20px; padding-top: 16px;
      border-top: 1px solid rgba(90,160,160,0.2);
    }
    .cart-total-label {
      font-family: var(--display);
      font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    }
    .cart-total-val {
      font-family: var(--display);
      font-size: 1.4rem; font-weight: 700; color: var(--accent);
    }
    .send-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 14px; margin-top: 16px; border: none;
      background: linear-gradient(135deg, #4a8f8f 0%, #3a7575 100%);
      color: #f0e8de;
      font-family: var(--display);
      font-size: .95rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; text-decoration: none; cursor: pointer; transition: all .3s;
    }
    .send-btn:hover { background: linear-gradient(135deg, #5aa0a0 0%, #4a8f8f 100%); transform: translateY(-1px); color: #f0e8de; }
    .send-btn svg { width: 16px; height: 16px; fill: currentColor; }
    .order-hint {
      margin-top: 12px; text-align: center;
      font-family: var(--display); font-style: italic;
      font-size: .78rem; color: var(--muted); line-height: 1.5;
    }
    .order-hint .orn, .toast .orn { width: 1.05em; height: 1.05em; vertical-align: -.15em; }
    .cart-actions { display: flex; gap: 8px; margin-top: 10px; }
    .vk-btn {
      flex: 1; padding: 12px 10px; border: 1px solid rgba(82,139,255,0.3);
      background: transparent; color: #7da7e8;
      font-size: .7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .1em; cursor: pointer; transition: all .2s;
      font-family: var(--sans); text-decoration: none;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .vk-btn:hover { border-color: rgba(82,139,255,0.55); background: rgba(82,139,255,0.08); color: #9dbdf0; }
    .vk-btn svg { width: 14px; height: 14px; fill: currentColor; }
    .copy-btn {
      flex: 1; padding: 12px 10px; border: 1px solid rgba(90,160,160,0.25);
      background: transparent; color: var(--accent);
      font-size: .7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .1em; cursor: pointer; transition: all .2s;
      font-family: var(--sans);
    }
    .copy-btn:hover { border-color: rgba(90,160,160,0.5); background: rgba(90,160,160,0.08); }
    .copy-btn.copied { border-color: rgba(90,160,160,0.5); background: rgba(90,160,160,0.12); }
    .clear-btn {
      flex: 1; padding: 12px 10px;
      border: 1px solid rgba(138,126,114,0.2); background: transparent;
      color: var(--faint); font-size: .7rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .1em; cursor: pointer; transition: all .2s;
      font-family: var(--sans);
    }
    .clear-btn:hover { border-color: rgba(255,60,60,0.4); color: #c45555; }
    .cart-empty {
      text-align: center; padding: 24px 0; color: var(--faint);
      font-style: italic; font-family: var(--display);
    }
    .hidden { display: none !important; }
    /* display:none would stop screen readers announcing the live region */
    .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap;
    }

    /* Empty result state */
    .empty-state { text-align: center; padding: 32px 0; }
    .reset-btn {
      margin-top: 14px; padding: 10px 20px;
      border: 1px solid rgba(138,126,114,0.25); background: transparent;
      color: var(--muted); font-family: var(--sans); font-size: .7rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .1em; cursor: pointer; transition: all .2s;
    }
    .reset-btn:hover { border-color: var(--accent-soft); color: var(--accent); }

    /* Toast — the order flow depends on a clipboard copy the user can't otherwise see */
    .toast {
      position: fixed; left: 50%; bottom: 96px; z-index: 400;
      transform: translate(-50%, 12px); opacity: 0;
      padding: 11px 20px; max-width: min(90vw, 420px);
      background: rgba(26,21,32,0.97); border: 1px solid rgba(90,160,160,0.35);
      color: var(--ink); font-size: .78rem; line-height: 1.45; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      pointer-events: none; transition: opacity .25s, transform .25s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.warn { border-color: rgba(196,85,85,0.5); }
    .toast .orn { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .fade-in, .controls, .header { opacity: 1 !important; transform: none !important; animation: none !important; }
      .card:hover { transform: none; }
      .card:hover .card-img img, .card:hover .card-img .ph { transform: none; }
      .pulse-line, .header-ornament .ico { animation: none !important; }
      .fandom-btn:hover .orn { transform: none; }
    }
  </style>
</head>

    const status = $('status')

    const showStatus = (text) => {
      status.textContent = text
      status.classList.remove('hidden')
    }

    const configured =
      SUPABASE_URL && SUPABASE_ANON_KEY && !SUPABASE_URL.startsWith('__')
    /* The Supabase client comes from a CDN — if that request is blocked the
       page used to die on a TypeError and show nothing at all. */
    const sdkReady = !!(window.supabase && window.supabase.createClient)

    if (!configured) {
      showStatus('Не настроено: добавьте переменные VITE_SUPABASE_URL и VITE_SUPABASE_ANON_KEY в настройках репозитория и сделайте редеплой (см. README).')
    } else if (!sdkReady) {
      showStatus('Не удалось загрузить каталог: библиотека не подгрузилась. Проверьте соединение и обновите страницу.')
    }

    const sb = configured && sdkReady
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null

    /* Toast: the order flow hinges on a clipboard copy the user can't see,
       and stock caps silently swallow taps — both need visible feedback. */
    let toastTimer
    function toast(text, kind) {
      const el = $('toast')
      el.textContent = text
      if (kind === 'ok') el.insertAdjacentHTML('beforeend', ' ' + icon('sparkle', 'orn'))
      el.className = 'toast show' + (kind ? ' ' + kind : '')
      clearTimeout(toastTimer)
      toastTimer = setTimeout(() => { el.className = 'toast' + (kind ? ' ' + kind : '') }, 2600)
    }

    const esc = (s) =>
      String(s).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

    const rub = (n) => new Intl.NumberFormat('ru-RU').format(n) + ' ₽'

    /* A hand-drawn icon from the sprite at the top of <body> */
    const icon = (name, cls, style) =>
      `<svg class="ico ${cls}" aria-hidden="true"${style ? ` style="${style}"` : ''}><use href="#i-${esc(name)}"/></svg>`

    /* Full fandom titles and each fandom's icon, matched loosely against the
       short catalog labels */
    const FANDOM_FULL = [
      {
        aliases: ['орв', 'orv', 'всеведущий читатель', 'omniscient reader'],
        ru: 'всеведущий читатель',
        en: "omniscient reader's viewpoint",
        icon: 'sparkle',
      },
      {
        aliases: ['msch', 's-ранги', 'с-ранги', 's-class', 'my s-class hunters', 'воспитанные мной s-классы'],
        ru: 'воспитанные мной s-классы',
        en: 'my s-class hunters',
        icon: 'flower',
      },
      {
        aliases: ['гсгв', 'gsgw', 'ghost story', 'история о призраках'],
        ru: 'даже если попадёшь в историю о призраках, всё равно придётся идти на работу',
        en: 'got dropped into a ghost story, still gotta work',
        icon: 'cat',
      },
      {
        aliases: ['oc', 'original characters', 'оригинальные персонажи'],
        ru: 'оригинальные персонажи',
        en: 'original characters',
        icon: 'swirl',
      },
    ]
    function fandomFull(name) {
      const n = String(name || '').trim().toLowerCase()
      if (!n) return null
      return FANDOM_FULL.find((f) => f.aliases.some((a) => n === a || n.includes(a))) || null
    }
    /* A fandom without its own icon gets the site's sparkle */
    const fandomIcon = (name) => fandomFull(name)?.icon || 'sparkle'

    let items = []
    let cart = {}
    let typeList = []
    let typeFilter = null
    let fandomList = []
    let fandomFilter = null
    let stockOnly = false
    let firstRender = true

    const fandomColors = ['#4a8f8f', '#a3854e', '#a64b6b', '#7b6ba4', '#5a8a6e', '#5aa0a0']
    let fandomColor = new Map()

    function buildFandomColors() {
      fandomColor = new Map()
      let idx = 0
      for (const i of items) {
        const key = i.fandom || 'Другое'
        if (!fandomColor.has(key)) {
          fandomColor.set(key, fandomColors[idx % fandomColors.length])
          idx++
        }
      }
    }

    function loadCart() {
      try {
        const saved = localStorage.getItem('hehearse_cart')
        if (saved) cart = JSON.parse(saved)
      } catch {}
    }
    /* Safari's private mode throws on setItem — losing persistence is fine,
       taking the whole "add to cart" click down with it is not. */
    function saveCart() {
      try {
        localStorage.setItem('hehearse_cart', JSON.stringify(cart))
      } catch {}
    }

    function addToCart(id) {
      const item = items.find((i) => i.id === id)
      if (!item || (item.stock_qty ?? 0) <= 0) return
      const max = item.stock_qty ?? 0
      const before = cart[id] || 0
      cart[id] = Math.min(before + 1, max)
      saveCart()
      updateCartUI()
      updateAddBtn(id)
      if (cart[id] > before) {
        const badge = $('cart-count')
        badge.classList.remove('pulse')
        void badge.offsetWidth
        badge.classList.add('pulse')
      } else {
        toast(`Больше нет в наличии — доступно ${max} шт.`, 'warn')
      }
    }

    function updateAddBtn(id) {
      const sel = window.CSS && CSS.escape ? CSS.escape(id) : id
      const btn = document.querySelector(`.add-btn[data-id="${sel}"]`)
      if (!btn) return
      const qty = cart[id] || 0
      if (qty > 0) {
        btn.classList.add('in-cart')
        btn.textContent = qty
      } else {
        btn.classList.remove('in-cart')
        btn.textContent = '+'
      }
    }

    function setQty(id, qty) {
      const item = items.find((i) => i.id === id)
      if (!item) return
      const max = item.stock_qty ?? 0
      if (qty <= 0) {
        delete cart[id]
      } else {
        if (qty > max) toast(`Больше нет в наличии — доступно ${max} шт.`, 'warn')
        cart[id] = Math.min(qty, max)
      }
      saveCart()
      updateCartUI()
      updateAddBtn(id)
    }

    function clearCart() {
      const ids = Object.keys(cart)
      cart = {}
      saveCart()
      updateCartUI()
      ids.forEach(updateAddBtn)
      toggleCart()
    }

    function getCartItems() {
      return Object.entries(cart)
        .map(([id, qty]) => {
          const item = items.find((i) => i.id === id)
          if (!item || qty <= 0) return null
          return { ...item, cartQty: qty }
        })
        .filter(Boolean)
    }

    function getCartTotal() {
      return getCartItems().reduce(
        (sum, i) => sum + (i.sale_price || 0) * i.cartQty, 0)
    }

    function getCartCount() {
      return Object.values(cart).reduce((s, q) => s + q, 0)
    }

    function buildTgMessage() {
      const ci = getCartItems()
      if (!ci.length) return ''
      let msg = 'Привет! Хочу заказать:\n\n'
      for (const i of ci) {
        const line = `• ${i.name}`
          + (i.type ? ` (${i.type})` : '')
          + ` × ${i.cartQty}`
          + (i.sale_price ? ` — ${rub(i.sale_price * i.cartQty)}` : '')
        msg += line + '\n'
      }
      msg += `\nИтого: ${rub(getCartTotal())}`
      msg += '\n\n---\n'
      const data = ci.map((i) => ({
        id: i.id,
        name: i.name,
        type: i.type,
        qty: i.cartQty,
        price: i.sale_price,
      }))
      msg += 'import:' + JSON.stringify(data)
      return msg
    }

    const plural = (n, one, few, many) => {
      const m10 = n % 10, m100 = n % 100
      if (m10 === 1 && m100 !== 11) return one
      if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few
      return many
    }

    function updateCartUI() {
      const count = getCartCount()
      const total = getCartTotal()
      $('cart-count').textContent = count
      $('cart-bar-total').textContent = rub(total)
      $('cart-bar').classList.toggle('visible', count > 0)
      $('cart-live').textContent = count
        ? `В корзине ${count} ${plural(count, 'товар', 'товара', 'товаров')} на ${rub(total)}`
        : ''

      const ci = getCartItems()
      if (!ci.length) {
        $('cart-items').innerHTML = '<div class="cart-empty">Корзина пуста</div>'
        $('cart-footer').classList.add('hidden')
        return
      }

      $('cart-footer').classList.remove('hidden')
      $('cart-total').textContent = rub(total)

      let html = ''
      for (const i of ci) {
        const color = fandomColor.get(i.fandom || 'Другое') || fandomColors[0]
        const thumb = i.image_url || i.product_photo_url
        const fIcon = fandomIcon(i.fandom)
        html += `<div class="cart-item">
          <div class="thumb"${thumb ? '' : ` style="background:linear-gradient(135deg,${color}22,${color}08)"`}>
            ${thumb
              ? `<img src="${esc(thumb)}" alt="" loading="lazy" decoding="async" data-fallback="${fIcon}" data-fallback-color="${color}" />`
              : icon(fIcon, 'ph', `color:${color}`)}
          </div>
          <div class="info">
            <div class="name">${esc(i.name)}</div>
            ${i.type ? `<div class="type-tag">${esc(i.type)}</div>` : ''}
            <div class="cart-price">${i.sale_price != null ? esc(rub(i.sale_price * i.cartQty)) : ''}</div>
          </div>
          <div class="qty-controls">
            <button type="button" class="qty-btn" data-act="qty" data-id="${esc(i.id)}" data-qty="${i.cartQty - 1}" aria-label="Убавить количество: ${esc(i.name)}">−</button>
            <span class="qty-val" aria-live="off">${i.cartQty}</span>
            <button type="button" class="qty-btn" data-act="qty" data-id="${esc(i.id)}" data-qty="${i.cartQty + 1}" aria-label="Добавить ещё: ${esc(i.name)}">+</button>
          </div>
        </div>`
      }
      $('cart-items').innerHTML = html
    }

    /* Overlay history: opening pushes a history entry, closing goes back,
       so the phone's back button closes the overlay instead of the page. */
    let detailOpen = false
    let cartOpen = false

    /* history.back() is async: without this guard a second close call
       (the X button's click bubbling to the overlay, a double-tap, or a
       held Escape) fires back() again and navigates out of the site. */
    let overlayClosing = false
    function closeOverlayViaBack() {
      if (overlayClosing) return
      overlayClosing = true
      history.back()
    }

    window.addEventListener('popstate', () => {
      overlayClosing = false
      if (detailOpen) hideDetail()
      else if (cartOpen) hideCart()
    })
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && (detailOpen || cartOpen)) { closeOverlayViaBack(); return }
      if (e.key === 'Tab') trapFocus(e)
    })

    /* Modal plumbing: without this the overlays were only visually modal —
       everything behind them stayed tabbable, and focus never entered the
       dialog or came back to the card that opened it. */
    const FOCUSABLE = 'a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])'
    let lastFocused = null

    function setInert(el, on) {
      if (!el) return
      el.inert = on
      el.setAttribute('aria-hidden', on ? 'true' : 'false')
    }

    function applyInert() {
      const anyOpen = detailOpen || cartOpen
      setInert($('detail-overlay'), !detailOpen)
      setInert($('cart-panel'), !cartOpen)
      setInert(document.querySelector('.wrap'), anyOpen)
      setInert($('cart-bar'), anyOpen)
      document.body.classList.toggle('scroll-locked', anyOpen)
    }

    function dialogRoot() {
      return detailOpen ? $('detail-card') : cartOpen ? $('cart-panel') : null
    }

    /* Fallback for browsers without `inert` — keeps Tab inside the dialog */
    function trapFocus(e) {
      const root = dialogRoot()
      if (!root) return
      const f = [...root.querySelectorAll(FOCUSABLE)].filter((el) => el.offsetParent !== null)
      if (!f.length) return
      const first = f[0], last = f[f.length - 1]
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus() }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus() }
    }

    function focusDialog() {
      const root = dialogRoot()
      if (!root) return
      const target = root.querySelector(FOCUSABLE)
      if (target) target.focus()
    }

    function restoreFocus() {
      if (lastFocused && document.contains(lastFocused)) lastFocused.focus()
      lastFocused = null
    }

    function openDetail(id) {
      const item = items.find((i) => i.id === id)
      if (!item) return
      const color = fandomColor.get(item.fandom || 'Другое') || fandomColors[0]
      const qty = item.stock_qty ?? 0
      const soldOut = qty <= 0
      const inCart = cart[item.id] > 0

      /* Prefer the real product photo in the detail view; fall back to the catalog art */
      const detailPhoto = item.product_photo_url || item.image_url
      const fIcon = fandomIcon(item.fandom)
      const imgHtml = (detailPhoto
        ? `<img src="${esc(detailPhoto)}" alt="${esc(item.name)}" data-fallback="${fIcon}" data-fallback-color="${color}" />`
        : icon(fIcon, 'ph', `color:${color}`))
        + (soldOut ? '<div class="stamp">Нет в наличии</div>' : '')
      $('detail-img').style.background = detailPhoto ? 'none' : `linear-gradient(135deg,${color}22,${color}08)`
      $('detail-img').classList.toggle('sold', soldOut)
      $('detail-img').innerHTML = imgHtml

      let info = ''
      if (item.type) info += `<div class="detail-type" style="color:${color}">${esc(item.type)}</div>`
      if (item.fandom) info += `<div class="detail-fandom">${esc(item.fandom)}</div>`
      info += `<h2 class="detail-name" id="detail-name">${esc(item.name)}</h2>`
      if (item.description) info += `<div class="detail-desc">${esc(item.description)}</div>`
      info += `<div class="detail-bottom">`
      if (item.sale_price != null) info += `<span class="detail-price">${esc(rub(item.sale_price))}</span>`
      else info += '<span></span>'
      if (soldOut) {
        info += `<span class="detail-sold">Нет в наличии</span>`
      } else {
        info += `<button type="button" class="detail-add${inCart ? ' in-cart' : ''}" data-act="detail-add" data-id="${esc(item.id)}">${inCart ? 'В корзине: ' + cart[item.id] : 'В корзину'}</button>`
      }
      info += '</div>'
      $('detail-info').innerHTML = info

      const wasOpen = detailOpen
      if (!wasOpen) {
        lastFocused = document.activeElement
        detailOpen = true
        overlayClosing = false
        history.pushState({ overlay: 'detail' }, '', '#item=' + encodeURIComponent(item.id))
      }
      $('detail-overlay').classList.add('open')
      applyInert()
      if (!wasOpen) focusDialog()
    }

    function hideDetail() {
      detailOpen = false
      $('detail-overlay').classList.remove('open')
      applyInert()
      restoreFocus()
    }

    function closeDetail(e) {
      if (e && e.target && !e.target.classList.contains('detail-overlay') && !e.target.classList.contains('detail-close')) return
      if (detailOpen) closeOverlayViaBack()
    }

    function openCart() {
      lastFocused = document.activeElement
      cartOpen = true
      overlayClosing = false
      history.pushState({ overlay: 'cart' }, '')
      $('cart-overlay').classList.add('open')
      $('cart-panel').classList.add('open')
      applyInert()
      focusDialog()
    }

    function hideCart() {
      cartOpen = false
      $('cart-overlay').classList.remove('open')
      $('cart-panel').classList.remove('open')
      applyInert()
      restoreFocus()
    }

    function toggleCart() {
      if (cartOpen) closeOverlayViaBack()
      else openCart()
    }

    /* Neither Telegram channel DMs (t.me/...?direct) nor vk.me support
       pre-filled text in the link, so every order button copies the message
       (with the import: payload) to the clipboard instead. */
    /* In-app browsers (Telegram, VK) often refuse the async Clipboard API, and
       the link navigates away regardless — so fall back to execCommand and
       always tell the user which of the two happened. */
    function legacyCopy(text) {
      const ta = document.createElement('textarea')
      ta.value = text
      ta.setAttribute('readonly', '')
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none'
      document.body.appendChild(ta)
      ta.select()
      ta.setSelectionRange(0, text.length)
      let ok = false
      try { ok = document.execCommand('copy') } catch { ok = false }
      ta.remove()
      return ok
    }

    function onCopied() {
      const btn = $('copy-btn')
      btn.textContent = 'Скопировано!'
      btn.classList.add('copied')
      setTimeout(() => { btn.textContent = 'Копировать текст'; btn.classList.remove('copied') }, 2000)
      toast('Текст заказа скопирован — вставьте его в чат', 'ok')
    }

    function onCopyFailed() {
      toast('Не удалось скопировать автоматически. Откройте «Копировать текст» и скопируйте вручную.', 'warn')
    }

    function copyOrder() {
      const msg = buildTgMessage()
      if (!msg) return
      const fallback = () => { if (legacyCopy(msg)) onCopied(); else onCopyFailed() }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(msg).then(onCopied).catch(fallback)
      } else {
        fallback()
      }
    }

    function setFandomFilter(idx) {
      const name = fandomList[idx]
      fandomFilter = fandomFilter === name ? null : name
      renderFandomChips()
      render()
    }

    function renderFandomChips() {
      /* Title size scales with how many items the fandom has (largest = 1.35rem,
         smallest = 1rem) — the buttons themselves stay equal for easy tapping. */
      const counts = new Map()
      for (const it of items) {
        const key = it.fandom || 'Другое'
        counts.set(key, (counts.get(key) || 0) + 1)
      }
      const maxCount = Math.max(1, ...counts.values())
      let html = ''
      fandomList.forEach((f, i) => {
        const color = fandomColor.get(f)
        const n = counts.get(f) || 0
        const fs = (1 + 0.35 * (n / maxCount)).toFixed(3)
        const on = fandomFilter === f
        html += `<button type="button" class="fandom-btn${on ? ' active' : ''}" style="--fc:${color};--fs:${fs}rem" data-act="fandom" data-idx="${i}" aria-pressed="${on}">
          ${icon(fandomIcon(f), 'orn')}${esc(f)}<span class="cnt">${n}<span class="sr-only"> ${plural(n, 'товар', 'товара', 'товаров')}</span></span>
        </button>`
      })
      const wrap = $('fandoms')
      wrap.innerHTML = html
      wrap.classList.toggle('has-active', !!fandomFilter)
      wrap.classList.remove('hidden')
    }

    function setTypeFilter(idx) {
      typeFilter = idx < 0 ? null : typeList[idx]
      renderChips()
      render()
    }

    function toggleStockOnly() {
      stockOnly = !stockOnly
      renderChips()
      render()
    }

    function renderChips() {
      let html = `<button type="button" class="chip${!typeFilter ? ' active' : ''}" data-act="type" data-idx="-1" aria-pressed="${!typeFilter}">Все</button>`
      typeList.forEach((t, i) => {
        const on = typeFilter === t
        html += `<button type="button" class="chip${on ? ' active' : ''}" data-act="type" data-idx="${i}" aria-pressed="${on}">${esc(t)}</button>`
      })
      html += `<button type="button" class="chip chip-stock${stockOnly ? ' active' : ''}" data-act="stock" aria-pressed="${stockOnly}">В наличии</button>`
      $('chips').innerHTML = html
      $('chips').classList.remove('hidden')
    }

    function renderSkeleton() {
      let cards = ''
      for (let i = 0; i < 6; i++) cards += '<div class="sk sk-card"></div>'
      const list = $('list')
      list.setAttribute('aria-busy', 'true')
      list.innerHTML = `<div class="fandom-group">
        <div class="sk sk-header"></div>
        <div class="card-grid">${cards}</div>
      </div>`
    }

    function render() {
      let visible = items
      if (fandomFilter) visible = visible.filter((i) => (i.fandom || 'Другое') === fandomFilter)
      if (typeFilter) visible = visible.filter((i) => i.type === typeFilter)
      if (stockOnly) visible = visible.filter((i) => (i.stock_qty ?? 0) > 0)

      // Single visible fandom → the whole page takes on its color
      const visibleFandoms = new Set(visible.map((i) => i.fandom || 'Другое'))
      if (visibleFandoms.size === 1) {
        document.documentElement.style.setProperty(
          '--page-accent', fandomColor.get([...visibleFandoms][0]) || '')
      } else {
        document.documentElement.style.removeProperty('--page-accent')
      }

      const groups = new Map()
      for (const i of visible) {
        const key = i.fandom || 'Другое'
        if (!groups.has(key)) groups.set(key, [])
        groups.get(key).push(i)
      }

      const animate = firstRender
      firstRender = false

      let html = ''
      let groupIdx = 0
      for (const [fandom, list] of groups) {
        const color = fandomColor.get(fandom) || fandomColors[0]
        const groupDelay = animate ? groupIdx * 100 : 0
        const fadeCls = animate ? ' fade-in' : ''
        const sorted = [
          ...list.filter((i) => (i.stock_qty ?? 0) > 0),
          ...list.filter((i) => (i.stock_qty ?? 0) <= 0),
        ]
        const full = fandomFull(fandom)
        const fIcon = fandomIcon(fandom)
        html += `<div class="fandom-group${fadeCls}"${animate ? ` style="animation-delay:${groupDelay}ms"` : ''}>
          <div class="fandom-header" style="border-bottom:1px solid ${color}33">
            ${icon(fIcon, 'orn', `color:${color}`)}
            <h2>${esc(fandom)}</h2>
            <div class="line" style="background:linear-gradient(to right,${color}33,transparent)"></div>
          </div>
          ${full ? `<div class="fandom-full">
            <div class="fandom-en">${esc(full.en)}</div>
            <div class="fandom-ru">${esc(full.ru)}</div>
          </div>` : ''}
          <div class="card-grid">`

        for (let i = 0; i < sorted.length; i++) {
          const item = sorted[i]
          const qty = item.stock_qty ?? 0
          const soldOut = qty <= 0
          const inCart = cart[item.id] > 0
          const delay = animate ? i * 60 : 0
          const img = item.image_url
            ? `<img src="${esc(item.image_url)}" alt="${esc(item.name)}" loading="lazy" decoding="async" data-fallback="${fIcon}" data-fallback-color="${color}" />`
            : icon(fIcon, 'ph', `color:${color}`)
          const addBtn = !soldOut
            ? `<button type="button" class="add-btn${inCart ? ' in-cart' : ''}" data-act="add" data-id="${esc(item.id)}" aria-label="Добавить в корзину: ${esc(item.name)}">${inCart ? cart[item.id] : '+'}</button>`
            : ''

          html += `<div class="card${fadeCls}${soldOut ? ' sold-out' : ''}" style="--fc:${color}${animate ? `;animation-delay:${groupDelay + delay}ms` : ''}">
            <button type="button" class="card-img" data-act="detail" data-id="${esc(item.id)}" aria-label="Подробнее: ${esc(item.name)}" aria-haspopup="dialog" style="background:${item.image_url ? 'none' : `linear-gradient(135deg,${color}22,${color}08)`}">
              ${img}
              <span class="card-idx" aria-hidden="true">${String(i + 1).padStart(2, '0')}</span>
              ${soldOut ? '<span class="stamp">Нет в наличии</span>' : `<span class="stock-badge in-stock">${qty} шт.</span>`}
            </button>
            <div class="card-info">
              ${item.type ? `<div class="card-type" style="color:${color}">${esc(item.type)}</div>` : ''}
              <div class="card-name">${esc(item.name)}</div>
              <div class="card-bottom">
                ${item.sale_price != null ? `<span class="card-price">${esc(rub(item.sale_price))}</span>` : '<span></span>'}
                ${addBtn}
              </div>
            </div>
          </div>`
        }

        html += '</div></div>'
        groupIdx++
      }

      if (!html) {
        const filtered = fandomFilter || typeFilter || stockOnly
        html = `<div class="empty-state">
          <p class="status">Ничего не найдено.</p>
          ${filtered ? '<button type="button" class="reset-btn" data-act="reset">Сбросить фильтры</button>' : ''}
        </div>`
      }
      $('list').innerHTML = html
      $('list').removeAttribute('aria-busy')
    }

    function resetFilters() {
      fandomFilter = null
      typeFilter = null
      stockOnly = false
      renderFandomChips()
      renderChips()
      render()
    }

    /* One delegated listener instead of inline onclick handlers carrying
       interpolated item ids — ids never have to survive an HTML attribute. */
    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-act]')
      if (!el) return
      const id = el.dataset.id
      switch (el.dataset.act) {
        case 'add': addToCart(id); break
        case 'qty': setQty(id, Number(el.dataset.qty)); break
        case 'detail': openDetail(id); break
        case 'detail-add':
          addToCart(id)
          openDetail(id)
          /* openDetail re-renders the panel, so re-focus the button we clicked */
          $('detail-info').querySelector('.detail-add')?.focus()
          break
        case 'fandom': setFandomFilter(Number(el.dataset.idx)); break
        case 'type': setTypeFilter(Number(el.dataset.idx)); break
        case 'stock': toggleStockOnly(); break
        case 'reset': resetFilters(); break
      }
    })

    /* A dead image URL used to leave a broken-image icon in the card */
    document.addEventListener('error', (e) => {
      const img = e.target
      if (img.tagName !== 'IMG' || !img.dataset.fallback) return
      const color = img.dataset.fallbackColor || fandomColors[0]
      const box = img.parentElement
      if (box) box.style.background = `linear-gradient(135deg,${color}22,${color}08)`
      img.insertAdjacentHTML('afterend', icon(img.dataset.fallback, 'ph', `color:${esc(color)}`))
      img.remove()
    }, true)

    async function loadItems() {
      renderSkeleton()
      let data, error
      try {
        ({ data, error } = await sb
          .from('public_stock')
          /* '*' so the page keeps working whether or not the view already exposes
             newer columns like product_photo_url (see supabase/public_stock_view.sql) */
          .select('*')
          .order('fandom', { ascending: true, nullsFirst: false })
          .order('name'))
      } catch (e) {
        /* A dropped connection rejects instead of returning an error object,
           which used to leave the skeleton spinning forever. */
        error = { message: e && e.message ? e.message : 'нет соединения' }
      }
      if (error) {
        $('list').innerHTML = ''
        showStatus(
          'Не удалось загрузить: ' + error.message +
          ' — если ошибка про "public_stock", выполните supabase/public_stock_view.sql в SQL Editor Supabase (см. README).')
        return
      }
      items = data || []
      buildFandomColors()
      fandomList = [...fandomColor.keys()]
      typeList = [...new Set(items.map((i) => i.type).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, 'ru'))
      loadCart()
      Object.keys(cart).forEach((id) => {
        const item = items.find((i) => i.id === id)
        const max = item ? (item.stock_qty ?? 0) : 0
        if (max <= 0) delete cart[id]
        else cart[id] = Math.min(cart[id], max)
      })
      saveCart()
      renderFandomChips()
      renderChips()
      render()
      updateCartUI()

      // Deep link: #item=<id> opens that item's detail view
      const hash = location.hash.match(/^#item=(.+)$/)
      if (hash) {
        const id = decodeURIComponent(hash[1])
        if (items.find((i) => i.id === id)) {
          history.replaceState(null, '', location.pathname + location.search)
          openDetail(id)
        }
      }
    }

    applyInert()
    if (sb) {
      loadItems()
    }
  </script>
</body>
</html>
