<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HEHEARSE — мерч</title>
  <meta name="description" content="Каталог мерча HEHEARSE: значки, стикеры и другое по любимым фандомам. Наличие обновляется автоматически." />
  <meta name="theme-color" content="#110e16" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="HEHEARSE — мерч" />
  <meta property="og:description" content="Каталог мерча по любимым фандомам. Наличие обновляется автоматически — выбирай и заказывай в Telegram." />
  <meta property="og:url" content="https://sterhn.github.io/Merch_page/" />
  <meta property="og:image" content="https://sterhn.github.io/Merch_page/assets/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="header">
      <h1>Hehearse</h1>
      <div class="header-pulse" aria-hidden="true">
        <svg class="pulse-line" viewBox="0 0 1000 50"><polyline points="3.5,32.25 20,32.25 23.5,20.25 30.5,48.5 37.5,3 44,42.5 49.25,27 52.75,32.25 60,32.25 65.5,23 70.5,45.5 77.5,2.75 82,41 88,25 90,32.25 107.25,32.25 109.75,25.75 115,40.5 120.75,8 126,36.75 130.5,32.25 146.5,32.25 149.5,23.25 154.25,32.25 943,32.25 946,26.5 953.75,39.5 963,11.5 968.25,36.5 973.25,32.25 986,32.25"/></svg>
        <span class="header-ornament"><svg class="ico"><use href="assets/icons/sprite.svg#i-sparkle"/></svg></span>
      </div>
      <a class="tg-link" data-link="telegram" target="_blank" rel="noopener">
        <svg class="ico" aria-hidden="true"><use href="assets/icons/sprite.svg#i-telegram"/></svg>
        Telegram
      </a>
    </header>

    <nav class="controls" aria-label="Фильтры каталога">
      <div id="fandoms" class="fandoms hidden" aria-label="Фандомы"></div>
      <div id="chips" class="chips hidden" aria-label="Тип товара"></div>
    </nav>

    <p id="status" class="status hidden" role="status"></p>
    <div id="app">
      <div id="list"></div>
    </div>

    <div class="footer">
      <div class="footer-rule">
        <div class="line line-l"></div>
        <svg class="ico orn" aria-hidden="true"><use href="assets/icons/sprite.svg#i-sparkle"/></svg>
        <div class="line line-r"></div>
      </div>
      <span>hehearse.exe</span>
    </div>
  </div>

  <!-- Cart bar -->
  <div id="cart-bar" class="cart-bar">
    <button type="button" class="cart-bar-inner" data-act="toggle-cart" aria-haspopup="dialog">
      <span class="cart-bar-left">
        <span class="cart-badge" id="cart-count">0</span>
        <span class="cart-bar-label">Корзина</span>
      </span>
      <span class="cart-bar-total" id="cart-bar-total">0 ₽</span>
    </button>
  </div>
  <p id="cart-live" class="sr-only" role="status" aria-live="polite"></p>

  <!-- Cart panel -->
  <div id="cart-overlay" class="cart-overlay" data-act="toggle-cart"></div>
  <div id="cart-panel" class="cart-panel" role="dialog" aria-modal="true" aria-labelledby="cart-title" aria-hidden="true">
    <div class="cart-panel-inner">
      <div class="cart-header">
        <span class="cart-title" id="cart-title">Ваш заказ</span>
        <button type="button" class="cart-close" data-act="toggle-cart" aria-label="Закрыть корзину">✕</button>
      </div>
      <div id="cart-items"></div>
      <div id="cart-footer" class="hidden">
        <div class="cart-total-row">
          <span class="cart-total-label">Итого</span>
          <span class="cart-total-val" id="cart-total">0 ₽</span>
        </div>
        <p id="cart-total-note" class="cart-total-note hidden">+ позиции с ценой по запросу</p>
        <a id="send-order" class="send-btn" data-link="telegram-order" data-act="order" target="_blank" rel="noopener" title="Текст заказа скопируется автоматически — вставьте его в чат и отправьте">
          <svg class="ico" aria-hidden="true"><use href="assets/icons/sprite.svg#i-telegram"/></svg>
          Написать в Telegram
        </a>
        <div class="cart-actions">
          <a class="vk-btn" data-link="vk-order" data-act="order" target="_blank" rel="noopener" title="Текст заказа скопируется автоматически — вставьте его в чат и отправьте">
            <svg class="ico" aria-hidden="true"><use href="assets/icons/sprite.svg#i-vk"/></svg>
            VK
          </a>
          <button type="button" class="copy-btn" id="copy-btn" data-act="copy">Копировать текст</button>
          <button type="button" class="clear-btn" data-act="clear">Очистить</button>
        </div>
        <div class="order-hint">При нажатии текст заказа копируется сам — просто вставьте его в чат и отправьте <svg class="ico orn" aria-hidden="true"><use href="assets/icons/sprite.svg#i-sparkle"/></svg></div>
      </div>
    </div>
  </div>

  <!-- Detail overlay -->
  <div id="detail-overlay" class="detail-overlay" data-act="detail-backdrop" role="dialog" aria-modal="true" aria-labelledby="detail-name" aria-hidden="true">
    <div class="detail-card" id="detail-card">
      <button type="button" class="detail-close" data-act="close-detail" aria-label="Закрыть">&#10005;</button>
      <div id="detail-img" class="detail-img"></div>
      <div id="detail-info" class="detail-info"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
